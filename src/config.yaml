# Cybersecurity Phishing Detection Configuration

# File Paths & Data Setup
file_path: "./data/data.csv"
target_column: "phishing_email"
text_feature: "email_text"

# Data Splitting Parameters
val_test_size: 0.3
val_size: 0.5
random_state: 42

# Decision Threshold & Risk Tiers
phishing_threshold: 0.60

# Target Class Mapping
target_mapping:
  Legitimate: 0
  Phishing: 1

# Feature Specifications
numerical_features:
  - email_length
  - number_of_links
  - number_of_attachments

nominal_features:
  - presence_of_urgent_keywords
  - sender_domain_type
  - html_content_flag

# Cross-Validation & Tuning Settings (NLP + Tabular Hybrid Pipeline)
cv: 5
scoring: "f1"

# Model Hyperparameter Tuning Grids
param_grids:
  LogisticRegression:
    classifier__C: [0.1, 1.0, 10.0]
    classifier__penalty: ["l2"]
    classifier__solver: ["lbfgs"]
    classifier__class_weight: [null]

  RandomForest:
    classifier__n_estimators: [50, 100, 150]
    classifier__max_depth: [5, 10, null]
    classifier__min_samples_leaf: [2, 5]
    classifier__class_weight: [null]

  KNN:
    classifier__n_neighbors: [5, 7, 9, 11]
    classifier__weights: ["uniform", "distance"]
