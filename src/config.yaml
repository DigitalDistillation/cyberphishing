# Cybersecurity Phishing Detection Configuration

# File Paths & Data Setup
file_path: "./data/data.csv"
target_column: "phishing_email"

# Data Splitting Parameters
val_test_size: 0.3
val_size: 0.5
random_state: 42

# Decision Threshold & Risk Tiers
phishing_threshold: 0.80
suspicious_threshold: 0.65

# Target Class Mapping
target_mapping:
  Legitimate: 0
  Phishing: 1

# Feature Specifications
numerical_features:
  - email_length
  - number_of_links
  - number_of_attachments

nominal_features:
  - presence_of_urgent_keywords
  - sender_domain_type
  - html_content_flag

# Cross-Validation & Tuning Settings (Precision-Focused to Eliminate False Alarms)
cv: 5
scoring: "precision"

# Model Hyperparameter Tuning Grids (Standard Unweighted Models with Smooth Regularization)
param_grids:
  LogisticRegression:
    classifier__C: [0.01, 0.1, 1.0]
    classifier__penalty: ["l2"]
    classifier__solver: ["lbfgs"]
    classifier__class_weight: [null]

  DecisionTree:
    classifier__max_depth: [3, 5, 8]
    classifier__min_samples_leaf: [5, 10]
    classifier__criterion: ["gini", "entropy"]
    classifier__class_weight: [null]

  RandomForest:
    classifier__n_estimators: [50, 100, 150]
    classifier__max_depth: [3, 5, 8]
    classifier__min_samples_leaf: [3, 5]
    classifier__class_weight: [null]

  KNN:
    classifier__n_neighbors: [5, 7, 9, 11]
    classifier__weights: ["uniform"]
